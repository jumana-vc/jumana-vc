
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600" height="620" viewBox="0 0 1600 620">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="35%" stop-color="#15172E"/>
      <stop offset="65%" stop-color="#38204D"/>
      <stop offset="85%" stop-color="#A34462"/>
      <stop offset="100%" stop-color="#F07855"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#DCCFFF"/>
      <stop offset="100%" stop-color="#EAA9D6"/>
    </linearGradient>

    <linearGradient id="roleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB36D"/>
      <stop offset="100%" stop-color="#F47C79"/>
    </linearGradient>

    <linearGradient id="mountainBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29253D"/>
      <stop offset="100%" stop-color="#111522"/>
    </linearGradient>

    <linearGradient id="mountainFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171B2A"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>

    <radialGradient id="horizonGlow">
      <stop offset="0%" stop-color="#F18A75" stop-opacity=".75"/>
      <stop offset="55%" stop-color="#B64C78" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#A64B80" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette">
      <stop offset="45%" stop-color="#080B14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05070D" stop-opacity=".8"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <clipPath id="rounded">
      <rect width="1600" height="620" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">

    <!-- Cinematic sky -->
    <rect width="1600" height="620" fill="url(#sky)"/>

    <!-- Atmospheric light -->
    <ellipse cx="1120" cy="350" rx="520" ry="210"
             fill="url(#horizonGlow)" filter="url(#blur)"/>

    <ellipse cx="1350" cy="405" rx="250" ry="90"
             fill="#F18A75" opacity=".22" filter="url(#blur)"/>

    <!-- Stars -->
    <g fill="#E8E2F5" opacity=".65">
      <circle cx="950" cy="75" r="2"/>
      <circle cx="1100" cy="110" r="1.5"/>
      <circle cx="1240" cy="60" r="2"/>
      <circle cx="1400" cy="120" r="1.5"/>
      <circle cx="1510" cy="65" r="2"/>
      <circle cx="850" cy="160" r="1.5"/>
      <circle cx="1330" cy="190" r="1"/>
      <circle cx="1040" cy="210" r="1"/>
    </g>

    <!-- Distant mountain range -->
    <path d="M650 390 L810 270 L920 345 L1080 205
             L1210 325 L1370 215 L1600 380 L1600 620 L650 620Z"
          fill="#29233F" opacity=".85"/>

    <!-- Second mountain range -->
    <path d="M520 450 L770 315 L910 410 L1100 285
             L1260 425 L1430 310 L1600 435 L1600 620 L520 620Z"
          fill="url(#mountainBack)"/>

    <!-- Foreground landscape -->
    <path d="M480 510 L700 405 L850 470 L1050 375
             L1210 465 L1390 365 L1600 475 L1600 620 L480 620Z"
          fill="url(#mountainFront)"/>

    <!-- Mist -->
    <g fill="none" stroke="#D4B3CF" opacity=".12">
      <path d="M650 430 Q950 390 1240 435" stroke-width="12"/>
      <path d="M720 465 Q1100 420 1510 470" stroke-width="7"/>
      <path d="M900 490 Q1200 465 1570 500" stroke-width="5"/>
    </g>

    <!-- Trees -->
    <g fill="#080B12">
      <path d="M1050 620 L1080 480 L1110 620Z"/>
      <path d="M1090 620 L1125 450 L1160 620Z"/>
      <path d="M1160 620 L1190 500 L1220 620Z"/>
      <path d="M1450 620 L1480 455 L1510 620Z"/>
      <path d="M1500 620 L1530 490 L1560 620Z"/>
      <path d="M1570 620 L1590 520 L1610 620Z"/>
    </g>

    <!-- Human silhouette sitting with laptop -->
    <g fill="#080A10">
      <!-- Head -->
      <ellipse cx="1310" cy="354" rx="25" ry="30"/>
      <!-- Body -->
      <path d="M1280 385 Q1310 370 1340 390 L1375 490
               L1250 490Z"/>
      <!-- Arm -->
      <path d="M1280 405 Q1240 430 1210 455 L1230 470
               Q1270 450 1300 430Z"/>
      <!-- Legs -->
      <path d="M1260 480 L1330 480 L1380 555
               L1350 570 L1290 520 L1240 570 L1210 555Z"/>
      <!-- Laptop -->
      <path d="M1190 455 L1295 455 L1315 490 L1170 490Z"
            fill="#202435" stroke="#737084" stroke-width="2"/>
      <path d="M1165 493 L1320 493 L1305 502 L1175 502Z"
            fill="#101522"/>
    </g>

    <!-- Dark text-side overlay -->
    <rect width="1600" height="620" fill="#080B14" opacity=".32"/>
    <rect width="820" height="620" fill="#080B14" opacity=".42"/>

    <!-- Intro label -->
    <text x="105" y="150"
          fill="#D5D4E0"
          font-family="Arial, Helvetica, sans-serif"
          font-size="24"
          font-weight="300"
          letter-spacing="8">
      HEY, I'M
    </text>

    <!-- Main name -->
    <text x="95" y="255"
          fill="url(#nameGradient)"
          font-family="Impact, 'Arial Narrow', sans-serif"
          font-size="112"
          font-weight="900"
          letter-spacing="1">
      JUMANA
    </text>

    <!-- Role -->
    <text x="105" y="315"
          fill="url(#roleGradient)"
          font-family="Impact, 'Arial Narrow', sans-serif"
          font-size="39"
          letter-spacing="5">
      DATA ANALYST
    </text>

    <!-- Education -->
    <text x="105" y="375"
          fill="#D0CFDA"
          font-family="Arial, Helvetica, sans-serif"
          font-size="23">
      BCA Graduate  •  Data Analytics Focus
    </text>

    <!-- Skills -->
    <text x="105" y="423"
          fill="#C1C0CE"
          font-family="Arial, Helvetica, sans-serif"
          font-size="20">
      Python  •  SQL  •  Excel  •  Power BI  •  Statistics
    </text>

    <!-- Description -->
    <text x="105" y="478"
          fill="#AAA9B8"
          font-family="Arial, Helvetica, sans-serif"
          font-size="18">
      Turning data into clear stories, useful insights,
    </text>
    <text x="105" y="506"
          fill="#AAA9B8"
          font-family="Arial, Helvetica, sans-serif"
          font-size="18">
      and decisions that make sense.
    </text>

    <!-- Glass-style social buttons -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="17">
      <rect x="105" y="545" width="150" height="46" rx="9"
            fill="#FFFFFF" fill-opacity=".08"
            stroke="#FFFFFF" stroke-opacity=".35"/>
      <text x="180" y="574" text-anchor="middle" fill="#F0F0F5">
        GitHub ↗
      </text>

      <rect x="275" y="545" width="165" height="46" rx="9"
            fill="#FFFFFF" fill-opacity=".08"
            stroke="#FFFFFF" stroke-opacity=".35"/>
      <text x="357" y="574" text-anchor="middle" fill="#F0F0F5">
        LinkedIn ↗
      </text>
    </g>

    <!-- Cinematic vignette -->
    <rect width="1600" height="620" fill="url(#vignette)"/>

    <!-- Subtle border -->
    <rect x="1" y="1" width="1598" height="618" rx="18"
          fill="none" stroke="#FFFFFF" stroke-opacity=".12"/>

  </g>
</svg>
